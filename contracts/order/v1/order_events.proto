syntax = "proto3";

package order.v1;

import "contracts/common/v1/metadata.proto";

option go_package = "contracts/order/v1;order";

// Order placed → reserve inventory
message OrderPlaced {
  common.v1.EventMetadata metadata = 1;

  string order_id = 2;
  string location_id = 3; // warehouse or store
}

// Order cancelled → release inventory
message OrderCancelled {
  common.v1.EventMetadata metadata = 1;

  string order_id = 2;
  string location_id = 3;
}
